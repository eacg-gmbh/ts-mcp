name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "scripts/**"
      - "ts-api/**"
      - "domain-mapping.yaml"
      - "Dockerfile"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, Scan & Publish
    # Publishing to Docker Hub is the PUBLIC repository's job (TrustSource/ts-mcp).
    # This fork must never push to the trustsource/ts-mcp namespace: it carries
    # internal AWS account details, VPC/subnet/security-group IDs and private DNS
    # names, and a push from here would overwrite the public :latest and :0.2.x
    # tags with an internally-modified image.
    #
    # Internal distribution goes through the ECR mirror instead (see PR #1).
    #
    # Guarding on the repository rather than deleting the file keeps this workflow
    # structurally identical to upstream, so syncing it from the public repo does
    # not produce delete/modify conflicts. In this fork the job is simply skipped,
    # which also ends the recurring "Username and password required" failures --
    # the Docker Hub secrets deliberately do not exist here.
    if: github.repository == 'TrustSource/ts-mcp'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # --- Build the image locally (don't push yet) ---

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: trustsource/ts-mcp
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single platform on purpose: `load: true` cannot load a multi-platform
      # manifest list into the docker daemon, and ts-scan needs one concrete
      # image to scan. amd64 is representative -- the npm dependency set is
      # identical across platforms, only the compiled binaries differ.
      - name: Build image for scanning (local only, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: trustsource/ts-mcp:scan-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Scan with ts-scan using Syft backend, then upload to TrustSource ---

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install ts-scan
        run: pip install "ts-scan>=1.7.0"

      - name: Scan Docker image
        run: |
          ts-scan scan \
            --use-syft \
            --tag "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            -o scan-results.json \
            docker:trustsource/ts-mcp:scan-candidate

      - name: Upload scan to TrustSource and gate on results
        id: scan-gate
        env:
          TS_API_KEY: ${{ secrets.TRUSTSOURCE_API_KEY }}
        run: |
          set -euo pipefail
          ts-scan upload \
            --api-key "$TS_API_KEY" \
            --project-name "ts-mcp" \
            --wait-for-analysis \
            --wait-timeout 300 \
            --exit-on-vulns \
            --Werror \
            scan-results.json

      # --- Only push to Docker Hub if scan passed ---

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.FRED4TS2DH }}

      - name: Push image to Docker Hub
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the amd64 layers built for the scan above, so the published
          # amd64 image is the one that actually passed the gate.
          cache-from: type=gha
          cache-to: type=gha,mode=max
