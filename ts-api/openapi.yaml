    riskIdParam:
      name: riskId
      in: path
      description: ID of the risk to read
      required: true
      schema:
        type: string
    taskIdParam:
      name: taskId
      in: path
      description: ID of the task to read
      required: true
      schema:
        type: string
    projectIdQuery:
      name: projectId
      in: query
      description: ID of the project to read
      required: true
      schema:
        type: string
    moduleIdParam:
      name: moduleId
      in: path
      description: ID of the module to read
      required: true
      schema:
        type: string
    apikeyParam:
      name: x-apikey
      in: header
      description: apikey to authorize the originator of the request
      required: true
      schema:
        type: string
    useragentParam:
      name: user-agent
      in: header
      description: 'Information about the utilized user-agent. The following format is suggested: user-agent: ''name/version'' '
      required: true
      schema:
        type: string
    scanIdParam:
      name: scan_id
      in: path
      description: ID of the scan to read
      required: true
      schema:
        type: string
    publicIdParam:
      name: public_id
      in: path
      description: ID of public-key to read
      required: true
      schema:
        type: string
    approvalIdParam:
      name: approval_id
      in: path
      description: ID of the approval
      required: true
      schema:
        type: string
    cveIdQuery:
      name: cve_id
      in: query
      description: ID of the cve to find
      required: true
      schema:
        type: string
    releaseKeyParam:
      name: release_key
      in: path
      description: Published release key
      required: true
      schema:
        type: string
    pageQuery:
      name: page
      in: query
      description: Page number to be fetched, starting from 1
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
