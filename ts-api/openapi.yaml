          description: Type of pkg to apply for included components
          schema:
            type: string
        - name: version
          in: query
          description: >-
            CycloneDX spec version (1.2–1.7) used as a fallback when the document
            body has no `specVersion` field.
          schema:
            type: string
        - name: project
          in: query
          description: Project name or project _id if you matching with existing project
          required: true
          schema:
            type: string
        - name: module
          in: query
          description: Module name or module _id if you matching with existing project
          schema:
            type: string
        - name: release
          in: query
          description: Specify release identifier
          schema:
            type: string
        - name: branch
          in: query
          description: Specify code branch
          schema:
            type: string
        - name: tag
          in: query
          description: Specify code tag
          schema:
            type: string
        - name: binaryLinks
          in: query
          description: Specify artifact binary links
          schema:
            type: string
        - name: demo
          in: query
          description: >-
            When `true`, the resulting scan and module are flagged as demo data.
          schema:
            type: boolean
