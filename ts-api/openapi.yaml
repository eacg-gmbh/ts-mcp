        references:
          type: array
          items:
            type: string
        cisa:
          type: object
          nullable: true
          description: >-
            CISA enrichment. Present only when this CVE is listed in the CISA
            Known Exploited Vulnerabilities (KEV) catalog - i.e. it is a known
            exploited vulnerability; omitted for CVEs that CISA has not flagged.
            Sourced from the U.S. Cybersecurity and Infrastructure Security
            Agency (CISA). Mirrors the CISA KEV entry, so besides the fields
            below it may also carry the other standard KEV fields
            (vendorProject, product, vulnerabilityName, shortDescription,
            dueDate, knownRansomwareCampaignUse, notes).
          additionalProperties: true
          properties:
            dateAdded:
