        request body. CycloneDX spec versions 1.2 through 1.7 are accepted; the
        version is taken from the document's `specVersion` field, falling back to
        the `version` query parameter. CycloneDX 1.7 `cryptographic-asset`
        components are not imported as dependencies — they are round-tripped into
        the module's crypto properties (CBOM) and linked to the components that
        reference them via the `dependencies` graph. Likewise `machine-learning-model`
        components are round-tripped into the module's AI artifacts (AIBOM). This is
        therefore also the endpoint for publishing an AIBOM or CBOM "as it is with
        the SBOM".
