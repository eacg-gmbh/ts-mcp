        name:
          type: string
        count:
          type: number

    Checksum:
      type: object
      description: 'Dictionary where a key denotes a checksum algorithm and the value is the checksum'
      additionalProperties:
        type: string

    CyclonedxComponent:
      title: CyclonedxComponent
      type: object
      description: >-
        A CycloneDX component (see CycloneDX specification). A `type` of
        `cryptographic-asset` is handled specially: it is not imported as a
        dependency but round-tripped into the module's crypto properties (CBOM)
        and linked via the document `dependencies` graph. `additionalProperties`
        is allowed, so any field defined by the CycloneDX spec may be supplied —
        including `bom-ref` (the component's unique reference within the BOM, used
        by the `dependencies` graph), which is accepted but not listed below
        because its name is not alphanumeric.
      properties:
        type:
          type: string
          description: >-
            Component type. One of: application, framework, library, container,
            platform, operating-system, device, device-driver, firmware, file,
            machine-learning-model, data, cryptographic-asset.
        name:
          type: string
        group:
          type: string
          description: Group/namespace the component belongs to
        version:
          type: string
        description:
          type: string
        publisher:
          type: string
          description: Imported as the component's provider
        author:
          type: string
        copyright:
          type: string
        cpe:
          type: string
        purl:
          type: string
          description: Package URL (pkg:type/namespace/name@version)
        supplier:
          description: Supplier name (string) or a CycloneDX supplier object with a `name` field
          oneOf:
            - type: string
            - type: object
              properties:
                name:
                  type: string
        licenses:
          type: array
          items:
            type: object
            properties:
              license:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  url:
                    type: string
              expression:
                type: string
                description: SPDX license expression (alternative to a license object)
        hashes:
          type: array
          description: >-
            Checksums; the highest-strength algorithm available is imported
            (priority SHA-512 → SHA-384 → SHA-256 → SHA-1 → MD5).
          items:
            type: object
            properties:
              alg:
                type: string
              content:
                type: string
        externalReferences:
          type: array
          description: >-
            External references; recognized types are mapped to component URLs —
            website→homepageUrl, vcs→repoUrl, mailing-list→mailingUrl,
            issue-tracker→issuesUrl, distribution→distributionUrl,
            documentation→documentationUrl.
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
        cryptoProperties:
          type: object
          description: >-
            CycloneDX 1.7 crypto properties; present only when `type` is
            `cryptographic-asset`. See the CycloneDX specification.
          additionalProperties: true
      additionalProperties: true

