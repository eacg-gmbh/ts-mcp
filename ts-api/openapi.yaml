          type: string
        viability:
          type: array
          items:
            title: Vulnerable component
            type: object
            properties:
              lastVisit:
                type: string
                format: date-time
              created_at:
                type: string
                format: date-time
              changed_at:
                type: string
                format: date-time
              openIssuesCnt:
                type: string
              forksCnt:
                type: string
              starsCnt:
                type: string
              monthlyCommitCnt:
                type: string
      description: Component details

    ReportCve:
      title: ReportCve
      type: object
      required:
        - name
        - modules
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        modules:
          type: array
          items:
            title: ModuleDetails
            type: object
            required:
              - _id
              - components
            properties:
              _id:
                type: string
              name:
                type: string
              architectureType:
                type: string
              components:
                type: array
                items:
                  title: Component details
                  type: object
                  properties:
                    key:
                      type: string
                    versions:
                      type: string
                    paths:
                      type: string
      description: Project details

    ModuleEntry:
      title: ModuleEntry
      type: object
      properties:
        _id:
          type: string
          description: the module id
        name:
          type: string
        description:
          type: string
        status:
          type: string
        analysis:
          type: object
          description: Module analysis results
          additionalProperties: true
      description: Module details

    ModuleStatusCounts:
      title: ModuleStatusCounts
      type: object
      properties:
        warnings:
          type: integer
          description: Number of warnings
          example: 2
        violations:
          type: integer
          description: Number of violations
          example: 0

    ModuleAnalysisStatistics:
      title: ModuleAnalysisStatistics
      type: object
      properties:
        licenses:
          type: integer
          description: Number of licenses found
          example: 12
        components:
          type: integer
          description: Number of components found
          example: 148
        legal:
          $ref: '#/components/schemas/ModuleStatusCounts'
        vulnerability:
          $ref: '#/components/schemas/ModuleStatusCounts'
        viability:
          $ref: '#/components/schemas/ModuleStatusCounts'
        versioning:
          $ref: '#/components/schemas/ModuleStatusCounts'
        integrity:
          $ref: '#/components/schemas/ModuleStatusCounts'
        analysisId:
          type: string
      description: Warning/violation counts per analysis dimension

    ModuleAnalysisSummary:
      title: ModuleAnalysisSummary
      type: object
      readOnly: true
      description: >-
        Latest analysis summary (date, scan and warning/violation statistics per
        analysis dimension). Read-only — only present in GET responses.
      properties:
        _id:
          type: string
          description: ID of the analysis document
          example: Kx2mWfTr8pQnLcVbS
        date:
          type: string
          format: date-time
          description: Date of the latest analysis
          example: '2026-05-28T14:32:11.000Z'
        scanId:
          type: string
          description: ID of the scan the analysis is based on
          example: aR7tNcXzQ4mYpJwHk
        statistics:
          $ref: '#/components/schemas/ModuleAnalysisStatistics'

    BWLicenseEntry:
      title: BWLicenseEntry
      type: object
      required:
        - key
        - comment
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: License key (SPDX identifier, e.g. `MIT`, `Apache-2.0`) or private license key
          example: Apache-2.0
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for adding the entry
        notApproved:
          type: boolean
          description: Set when the entry has not yet been approved by a compliance manager
      description: License white-/blacklist entry

    BWComponentEntry:
      title: BWComponentEntry
      type: object
      required:
        - key
        - version
        - comment
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: Component key, e.g. `npm:lodash` or `mvn:org.apache.commons:commons-lang3`
          example: 'npm:lodash'
        version:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?:[A-Za-z0-9_\.-]+|[A-Za-z0-9_\.-]*\*)$'
          description: Exact version or wildcard pattern (`1.2.*`, `*`)
          example: '1.2.*'
        path:
          type: string
          description: Optional dependency path the entry applies to
        status:
          type: string
          description: Target status, used for entries in `changedStatus`
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for adding the entry
      description: Component list entry (white-/blacklist, unchanged, loose-coupled, changed status)

    SelectedLicenseEntry:
      title: SelectedLicenseEntry
      type: object
      required:
        - key
        - version
        - comment
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
          description: Component key
        version:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?:[A-Za-z0-9_\.-]+|[A-Za-z0-9_\.-]*\*)$'
          description: Exact version or wildcard pattern (`1.2.*`, `*`)
          example: '1.2.*'
        path:
          type: string
          description: Optional dependency path the selection applies to
        license:
          type: string
          description: License key selected as effective for this component
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for the license selection
      description: Effective-license selection for a multi-licensed component

    BWCveEntry:
      title: BWCveEntry
      type: object
      required:
        - cveKey
        - key
        - version
        - comment
      properties:
        cveKey:
          type: string
          minLength: 1
          maxLength: 250
          description: CVE identifier
          example: CVE-2021-44228
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: Component key the entry applies to
        version:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?:[A-Za-z0-9_\.-]+|[A-Za-z0-9_\.-]*\*)$'
          description: Exact version or wildcard pattern (`1.2.*`, `*`)
          example: '1.2.*'
        path:
          type: string
          description: Optional dependency path the entry applies to
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for white-/blacklisting the CVE
      description: CVE white-/blacklist entry

    ObligationEntry:
      title: ObligationEntry
      type: object
      required:
        - obligationKey
        - comment
      properties:
        obligationKey:
          type: string
          minLength: 1
          maxLength: 250
          description: Key of the obligation the entry applies to
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: Optional component key to narrow the entry to a single component
        version:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?:[A-Za-z0-9_\.-]+|[A-Za-z0-9_\.-]*\*)$'
          description: Exact version or wildcard pattern (`1.2.*`, `*`)
          example: '1.2.*'
        path:
          type: string
          description: Optional dependency path the entry applies to
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for the obligation handling
      description: Obligation handling entry

    LegalRulesEntry:
      title: LegalRulesEntry
      type: object
      required:
        - ruleKey
        - comment
      properties:
        ruleKey:
          type: string
          minLength: 1
          maxLength: 250
          description: Key of the legal rule the entry applies to
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: Optional component key to narrow the entry to a single component
        version:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?:[A-Za-z0-9_\.-]+|[A-Za-z0-9_\.-]*\*)$'
          description: Exact version or wildcard pattern (`1.2.*`, `*`)
          example: '1.2.*'
        path:
          type: string
          description: Optional dependency path the entry applies to
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for the legal rule exception
      description: Legal rule exception entry

    LicenseConfig:
      title: LicenseConfig
      type: object
      required:
        - whitelist
        - blacklist
      properties:
        whitelist:
          type: array
          description: Licenses explicitly allowed
          items:
            $ref: '#/components/schemas/BWLicenseEntry'
        blacklist:
          type: array
          description: Licenses explicitly forbidden
          items:
            $ref: '#/components/schemas/BWLicenseEntry'
      description: >-
        License white-/blacklists. Both lists are required when the object is
        provided — send empty arrays to clear a list.

    ModuleComponentConfig:
      title: ModuleComponentConfig
      type: object
      properties:
        whitelist:
          type: array
          description: Components explicitly allowed
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        blacklist:
          type: array
          description: Components explicitly forbidden
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        unchanged:
          type: array
          description: Components declared as used unchanged (relevant for obligation resolution)
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        looseCoupled:
          type: array
          description: Components declared as loosely coupled (relevant for copyleft evaluation)
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        licensesSelected:
          type: array
          description: Effective-license selections for multi-licensed components
          items:
            $ref: '#/components/schemas/SelectedLicenseEntry'
        changedStatus:
          type: array
          description: Components with manually overridden analysis status
          items:
            $ref: '#/components/schemas/BWComponentEntry'
      description: Component-level settings of the module

    CveConfig:
      title: CveConfig
      type: object
      required:
        - whitelist
        - blacklist
      properties:
        whitelist:
          type: array
          description: CVEs accepted/ignored during vulnerability analysis
          items:
            $ref: '#/components/schemas/BWCveEntry'
        blacklist:
          type: array
          description: CVEs explicitly flagged
          items:
            $ref: '#/components/schemas/BWCveEntry'
      description: >-
        CVE white-/blacklists. Both lists are required when the object is
        provided — send empty arrays to clear a list.

    ModuleViabilityConfig:
      title: ModuleViabilityConfig
      type: object
      required:
        - warningThreshold
        - violationThreshold
        - minConfidence
        - noInfoLevel
      properties:
        enabled:
          type: boolean
          description: Enables/disables viability analysis for this module
        warningThreshold:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Activity level below which a warning is raised.
            0 = no monitoring, 1 = very low activity, 2 = low activity,
            3 = normal activity, 4 = very active.
            Must not be lower than `violationThreshold` (unless 0).
        violationThreshold:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Activity level below which a violation is raised. Same scale as
            `warningThreshold`.
        minConfidence:
          type: integer
          minimum: 1
          maximum: 3
          description: Minimum number of indicators (1-3) required to rate viability
        noInfoLevel:
          type: integer
          minimum: 1
          maximum: 3
          description: >-
            Status reported when the minimum confidence level is not reached.
            1 = OK, 2 = Warning, 3 = Violation
      description: Viability (project activity) analysis settings

    ModuleOssfConfig:
      title: ModuleOssfConfig
      type: object
      required:
        - warningThreshold
        - violationThreshold
        - noInfoLevel
      properties:
        enabled:
          type: boolean
          description: Enables/disables OpenSSF Scorecard analysis for this module
        warningThreshold:
          type: integer
          minimum: 0
          maximum: 9
          description: >-
            OpenSSF Scorecard score below which a warning is raised
            (0 = no monitoring). Must not be lower than `violationThreshold` (unless 0).
        violationThreshold:
          type: integer
          minimum: 0
          maximum: 9
          description: OpenSSF Scorecard score below which a violation is raised (0 = no monitoring)
        noInfoLevel:
          type: integer
          minimum: 1
          maximum: 3
          description: >-
            Status reported when no score is available.
            1 = OK, 2 = Warning, 3 = Violation
      description: OpenSSF Scorecard analysis settings

    ModuleVersioningConfig:
      title: ModuleVersioningConfig
      type: object
      required:
        - jump
        - warningThreshold
        - violationThreshold
      properties:
        enabled:
          type: boolean
          description: Enables/disables versioning analysis for this module
        jump:
          type: boolean
          description: Enables version-jump detection
        warningThreshold:
          type: integer
          minimum: 0
          maximum: 3
          description: >-
            How far behind the latest version a component may be before a warning is raised.
            0 = no monitoring, 1 = more than 7 versions behind, 2 = 4-6 versions behind,
            3 = less than 3 versions behind.
            Must not be lower than `violationThreshold` (unless 0).
        violationThreshold:
          type: integer
          minimum: 0
          maximum: 3
          description: >-
            How far behind the latest version a component may be before a violation is
            raised. Same scale as `warningThreshold`.
      description: Versioning (outdated components) analysis settings

    ModuleRequirements:
      title: ModuleRequirements
      type: object
      required:
        - TS
        - LS
        - D
      properties:
        TS:
          type: string
          enum: [TS_y, TS_n]
          description: >-
            Trade secret protection.
            TS_y = trade secrets need to be protected,
            TS_n = trade secrets may be released
        LS:
          type: string
          enum: [LS_pl, LS_os]
          description: >-
            Sub-licensing.
            LS_pl = module shall be licensed under a proprietary license,
            LS_os = module is planned to be released as open source
        D:
          type: string
          enum: [D_op, D_ipoa, D_xa, D_cslib, D_sslib, D_never]
          description: >-
            Distribution model — determines which obligations are resolved.
            D_op = distributed for on-premise use (installer, physical media or download),
            D_ipoa = integral part of a shipped appliance/device/software,
            D_xa = exchangeable addon to a shipped appliance/device/software,
            D_cslib = client-side library in a web solution,
            D_sslib = server-side library in a web solution (not distributed),
            D_never = applied just locally, not distributed at all
      description: Compliance requirements driving obligation resolution

    CIARequirements:
      title: CIARequirements
      type: object
      required:
        - CR
        - IR
        - AR
      properties:
        CR:
          type: string
          enum: [X, L, M, H]
          description: 'Confidentiality requirement: X = not defined, L = low, M = medium, H = high'
        IR:
          type: string
          enum: [X, L, M, H]
          description: 'Integrity requirement: X = not defined, L = low, M = medium, H = high'
        AR:
          type: string
          enum: [X, L, M, H]
          description: 'Availability requirement: X = not defined, L = low, M = medium, H = high'
      description: CIA requirements used as CVSS environmental modifiers

    Classification:
      title: Classification
      type: object
      properties:
        MDR:
          type: string
          enum: ['', I, IIa, IIb, III]
          description: >-
            Medical Device Regulation risk class.
            I = low risk (e.g. passive objects), IIa = medium risk (outside body, not life
            supporting), IIb = higher risk (life supportive but outside body),
            III = high risk (e.g. in blood). Empty string = none
        IVDR:
          type: string
          enum: ['', A, B, C, D]
          description: >-
            In-vitro Diagnostic Regulation risk class.
            A = low individual risk and low risk to public health,
            B = moderate individual risk and/or low risk to public health,
            C = high individual risk and/or medium risk to public health,
            D = high individual and/or high risk to public health. Empty string = none
      description: Regulatory classification of the module

    ModuleProperties:
      title: ModuleProperties
      type: object
      properties:
        architectureType:
          type: string
          enum: [FEU, FEE, FES, BES, BEE, SC, IS, DC]
          description: >-
            Type of architecture.
            FEU = Frontend-UI-Module, FEE = Frontend-Endpoint, FES = Frontend-Service,
            BES = Backend-Service, BEE = Backend-Endpoint, SC = System component,
            IS = Infrastructure Service, DC = Distributable Component
        architecture:
          type: string
          enum: [infrastructureModule, infrastructureTemplate, sourceCode]
          description: Module kind
        privacy:
          type: string
          enum: [opensource, private]
          description: Whether the module itself is open source or private
      description: Architectural properties of the module

    ModuleEnvironmentalConfig:
      title: ModuleEnvironmentalConfig
      type: object
      properties:
        v2vectorString:
          type: string
          description: CVSS v2 environmental vector string applied when re-scoring vulnerabilities
        v3vectorString:
          type: string
          description: CVSS v3 environmental vector string applied when re-scoring vulnerabilities
        v4vectorString:
          type: string
          description: CVSS v4 environmental vector string applied when re-scoring vulnerabilities
      description: CVSS environmental re-scoring settings

    EnvironmentalContext:
      title: EnvironmentalContext
      type: object
      description: >-
        A module's CVSS environmental (iCVSS) context - the read-only projection
        returned by the environmental-context endpoints. ciaRequirements is null
        when the module has none (the stored discrete letters are passed through
        verbatim, never synthesized). environmentalConfig always carries all three
        vector keys, each null when absent. mav is the Modified Attack Vector
        parsed from the v4 (then v3) vector, and is null when neither carries a
        MAV token (or the MAV is X); the v2 vector is never inspected for MAV.
      properties:
        moduleId:
          type: string
        projectId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        ciaRequirements:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CIARequirements'
        environmentalConfig:
          type: object
          properties:
            v2vectorString:
              type: string
              nullable: true
            v3vectorString:
              type: string
              nullable: true
            v4vectorString:
              type: string
              nullable: true
        mav:
          type: string
          nullable: true
          enum: [N, A, L, P]
          description: 'Modified Attack Vector: N = Network, A = Adjacent, L = Local, P = Physical; null when absent / not-defined'

    EndoflifePolicy:
      title: EndoflifePolicy
      type: object
      required:
        - warningThreshold
        - violationThreshold
      properties:
        enabled:
          type: boolean
          description: Enables/disables end-of-life analysis
        warningThreshold:
          type: integer
          minimum: 0
          maximum: 24
          description: >-
            Months before component end-of-life at which a warning is raised
            (0 = no monitoring). Must not be lower than `violationThreshold` (unless 0).
        violationThreshold:
          type: integer
          minimum: 0
          maximum: 24
          description: Months before component end-of-life at which a violation is raised (0 = no monitoring)
      description: End-of-life policy settings

    CustomComponentEntry:
      title: CustomComponentEntry
      type: object
      required:
        - key
        - version
        - comment
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: Component key
        version:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?:[A-Za-z0-9_\.-]+|[A-Za-z0-9_\.-]*\*)$'
          description: Exact version or wildcard pattern (`1.2.*`, `*`)
          example: '1.2.*'
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: Reason for attaching the component
      description: Custom component manually attached to the module

    ModuleSettings:
      title: ModuleSettings
      type: object
      description: >-
        All module settings manageable via the API. The read-only fields
        `_id`, `status` and `analysis` are only present in GET responses and
        are ignored when sent in requests.
      properties:
        _id:
          type: string
          readOnly: true
          description: the module id
          example: vewfCuCmkpqXyuDrX
        status:
          type: string
          readOnly: true
          description: Overall module status
          enum: [ok, warnings, violations]
          example: warnings
        analysis:
          $ref: '#/components/schemas/ModuleAnalysisSummary'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Module name. Must not contain `<` or `>`
          example: payment-service
        version:
          type: string
          minLength: 1
          maxLength: 200
          description: Module version
          example: 2.4.0
        description:
          type: string
          maxLength: 2000
          description: Module description
          example: Backend payment processing service
        moduleIdentifier:
          type: string
          maxLength: 200
          description: Module identifier used to match incoming scans to this module
          example: 'payment-service'
        projectId:
          type: string
          description: ID of the project the module is assigned to
          example: q3edXmFkB2sJzu9aM
        tags:
          type: array
          description: Tag IDs assigned to the module (IDs, not tag names)
          items:
            type: string
        confidenceMinScore:
          type: string
          enum: ['1', '4', '5']
          description: >-
            Default confidence level for license findings.
            5 = high only, 4 = medium and higher, 1 = all
        licenseConfig:
          $ref: '#/components/schemas/LicenseConfig'
        componentConfig:
          $ref: '#/components/schemas/ModuleComponentConfig'
        viabilityConfig:
          $ref: '#/components/schemas/ModuleViabilityConfig'
        ossfConfig:
          $ref: '#/components/schemas/ModuleOssfConfig'
        versioningConfig:
          $ref: '#/components/schemas/ModuleVersioningConfig'
        cveConfig:
          $ref: '#/components/schemas/CveConfig'
        obligationConfig:
          type: array
          description: Obligation handling entries
          items:
            $ref: '#/components/schemas/ObligationEntry'
        legalRulesConfig:
          type: array
          description: Legal rule exception entries
          items:
            $ref: '#/components/schemas/LegalRulesEntry'
        requirements:
          $ref: '#/components/schemas/ModuleRequirements'
        ciaRequirements:
          $ref: '#/components/schemas/CIARequirements'
        classification:
          $ref: '#/components/schemas/Classification'
        properties:
          $ref: '#/components/schemas/ModuleProperties'
        environmentalConfig:
          $ref: '#/components/schemas/ModuleEnvironmentalConfig'
        endoflifePolicy:
          $ref: '#/components/schemas/EndoflifePolicy'
        customComponents:
          type: array
          description: Custom components manually attached to the module
          items:
            $ref: '#/components/schemas/CustomComponentEntry'

    RequestBodyUpdateModule:
      title: RequestBodyUpdateModule
      description: >-
        Module settings to update. All fields are optional — only provided fields are
        updated, but each provided top-level field replaces the stored value as a whole.
      allOf:
        - $ref: '#/components/schemas/ModuleSettings'

    ProjectComponentConfig:
      title: ProjectComponentConfig
      type: object
      required:
        - whitelist
        - blacklist
        - unchanged
        - looseCoupled
      properties:
        whitelist:
          type: array
          description: Components explicitly allowed
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        blacklist:
          type: array
          description: Components explicitly forbidden
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        unchanged:
          type: array
          description: Components declared as used unchanged (relevant for obligation resolution)
          items:
            $ref: '#/components/schemas/BWComponentEntry'
        looseCoupled:
          type: array
          description: Components declared as loosely coupled (relevant for copyleft evaluation)
          items:
            $ref: '#/components/schemas/BWComponentEntry'
      description: >-
        Component-level settings of the project. All four lists are required when the
        object is provided — send empty arrays to clear a list.

    ProjectRequirements:
      title: ProjectRequirements
      type: object
      required:
        - CA
        - OM
        - IP_protect
        - IP_enforce
      properties:
        CA:
          type: string
          enum: [CA_usage, CA_license, CA_support, CA_other, CA_none]
          description: >-
            Commercial application.
            CA_usage = usage fee charged for the product/service,
            CA_license = license fee charged (royalties or other fees),
            CA_support = only a support fee charged for additional services,
            CA_other = other commercialisation (e.g. maintenance or warranty),
            CA_none = product is not commercial
        OM:
          type: string
          enum: [OM_SaaS, OM_mop, OM_sw, OM_dis]
          description: >-
            Operational model.
            OM_SaaS = operated as Software as a Service,
            OM_mop = operated at customer locations as a managed service,
            OM_sw = traditional software-distribution model,
            OM_dis = part of an appliance / embedded in a device or hardware
        IP_protect:
          type: string
          enum: [IP_protect_n, IP_protect_y]
          description: >-
            Inbound IP protection.
            IP_protect_n = no extended protection from 3rd-party claims sought,
            IP_protect_y = explicitly reduce risk of patent claims by OSS contributors
        IP_enforce:
          type: string
          enum: [IP_enforce_1, IP_enforce_2, IP_enforce_3]
          description: >-
            Outbound IP protection.
            IP_enforce_1 = no enforcement of own claims sought,
            IP_enforce_2 = retain freedom to enforce own patent claims without
            risk of license termination,
            IP_enforce_3 = ensure freedom to enforce own patent claims without
            risk of license termination
      description: Compliance requirements driving obligation resolution on project level

    ProjectJiraSettings:
      title: ProjectJiraSettings
      type: object
      writeOnly: true
      description: >-
        Jira integration settings. Write-only — contains credentials and is
        never returned by GET
      required:
        - active
      properties:
        url:
          type: string
          description: Jira base URL
        user:
          type: string
          description: Jira user name
        passwd:
          type: string
          description: Jira password/API token
        key:
          type: string
          description: Jira project key
        type:
          type: string
          description: Jira issue type
        email:
          type: string
          description: Jira account e-mail
        active:
          type: boolean
          description: Enables/disables the integration

    ProjectTfsSettings:
      title: ProjectTfsSettings
      type: object
      writeOnly: true
      description: >-
        Azure DevOps / TFS integration settings. Write-only — contains
        credentials and is never returned by GET
      required:
        - account
        - project
        - token
        - active
      properties:
        account:
          type: string
          description: Azure DevOps / TFS account
        project:
          type: string
          description: Azure DevOps / TFS project
        token:
          type: string
          description: Personal access token
        active:
          type: boolean
          description: Enables/disables the integration

    ProjectGithubSettings:
      title: ProjectGithubSettings
      type: object
      writeOnly: true
      description: >-
        GitHub integration settings. Write-only — contains credentials and is
        never returned by GET
      required:
        - token
        - repository
        - active
      properties:
        token:
          type: string
          description: GitHub access token
        repository:
          type: string
          description: GitHub repository (owner/name)
        active:
          type: boolean
          description: Enables/disables the integration

    ProjectSettings:
      title: ProjectSettings
      type: object
      description: >-
        All project settings manageable via the API (integration credentials
        excluded from responses). The read-only field `_id` is only present in
        GET responses and is ignored when sent in requests.
      properties:
        _id:
          type: string
          readOnly: true
          description: the project id
          example: q3edXmFkB2sJzu9aM
        name:
          type: string
          minLength: 3
          maxLength: 200
          description: Project name. Must not contain `<` or `>`
          example: webshop-platform
        description:
          type: string
          maxLength: 2000
          description: Project description / application goals
          example: Customer-facing webshop platform
        requireWhitelist:
          type: boolean
          description: >-
            Allow-list mode — when true, components must be explicitly whitelisted
            to be accepted
        tags:
          type: array
          description: Tag IDs assigned to the project (IDs, not tag names)
          items:
            type: string
        confidenceMinScore:
          type: string
          enum: ['1', '4', '5']
          description: >-
            Default confidence level for license findings.
            5 = high only, 4 = medium and higher, 1 = all
        licenseConfig:
          $ref: '#/components/schemas/LicenseConfig'
        componentConfig:
          $ref: '#/components/schemas/ProjectComponentConfig'
        cveConfig:
          $ref: '#/components/schemas/CveConfig'
        obligationConfig:
          type: array
          description: Obligation handling entries
          items:
            $ref: '#/components/schemas/ObligationEntry'
        legalRulesConfig:
          type: array
          description: Legal rule exception entries
          items:
            $ref: '#/components/schemas/LegalRulesEntry'
        requirements:
          $ref: '#/components/schemas/ProjectRequirements'
        ciaRequirements:
          $ref: '#/components/schemas/CIARequirements'
        classification:
          $ref: '#/components/schemas/Classification'
        endoflifePolicy:
          $ref: '#/components/schemas/EndoflifePolicy'
        jira:
          $ref: '#/components/schemas/ProjectJiraSettings'
        tfs:
          $ref: '#/components/schemas/ProjectTfsSettings'
        github:
          $ref: '#/components/schemas/ProjectGithubSettings'

    RequestBodyCreateProject:
      title: RequestBodyCreateProject
      description: Project to create. `name` is required, all other settings are optional.
      allOf:
        - type: object
          required:
            - name
        - $ref: '#/components/schemas/ProjectSettings'

    RequestBodyUpdateProject:
      title: RequestBodyUpdateProject
      description: >-
        Project settings to update. All fields are optional — only provided fields are
        updated, but each provided top-level field replaces the stored value as a whole.
      allOf:
        - $ref: '#/components/schemas/ProjectSettings'

    Generic200:
      type: object
      properties:
        status:
          type: string
          example: "ok"

    CyclonedxDocument:
      title: CyclonedxDocument
      type: object
      description: >-
        A CycloneDX 1.7 BOM document. The AIBOM variant carries
        `machine-learning-model` components (with `modelCard`); the CBOM variant
        carries `cryptographic-asset` components. `additionalProperties` is allowed,
        so any field defined by the CycloneDX spec may be present.
      properties:
        bomFormat:
          type: string
          example: CycloneDX
        specVersion:
          type: string
          example: "1.7"
        serialNumber:
          type: string
        version:
          type: number
        metadata:
          type: object
          description: CycloneDX metadata block (see CycloneDX specification)
          additionalProperties: true
        components:
          type: array
          items:
            $ref: '#/components/schemas/CyclonedxComponent'
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    ResponseCreateScan200:
      title: Scan created
      type: object
      properties:
        scanId:
          type: string
          description: ID of created scan
        moduleId:
          type: string
          description: ID of corresponding module inside TrustSource

    SBOM:
      title: sBOM
      type: object
      required:
        - list
        - modules
      properties:
        stats:
          type: object
        company:
          type: object
        project:
          type: object
        module:
          type: object
        tree:
          type: object
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleEntry'
        list:
          type: array
          items:
            $ref: '#/components/schemas/Component'

    Countermeasure:
      title: Countermeasure
      type: object
      required:
        - countermeasure
      properties:
        _id:
          type: string
          description: >-
            Server-generated countermeasure identifier — assigned on create,
            ignored when sent in a request body
          example: Hk6cesvWdoX5Yqbo8
        countermeasure:
          type: string
          minLength: 3
          maxLength: 200
          description: >-
            Countermeasure name — must be 3-200 characters, `<` and `>` are not allowed
          example: Upgrade to patched version
        status:
          type: string
          enum: ['', identified, planned, completed, ok, required, not-required, verified]
          description: Implementation status of the countermeasure
        comment:
          type: string
          description: Optional comment
        responsible:
          type: array
          description: User IDs of the responsible users
          items:
            type: string
        riskReduction:
          type: number
          minimum: 0
          maximum: 100
          description: Estimated risk reduction in percent
          example: 90
        standardRef:
          type: string
          maxLength: 200
          description: Reference to a security standard or control
          example: OWASP-ASVS V5.3.4
        validationMethod:
          type: string
          maxLength: 200
          description: How the effectiveness of the countermeasure is validated
          example: 'test-suite: tests/security/sqli_test.py'
        otmMitigationId:
          type: string
          maxLength: 200
          description: Open Threat Model mitigation identifier
          example: m-prepared-statements
      description: Risk countermeasure entry

    ThreatModelContext:
      title: Threat model context
      type: object
      description: Threat-modelling context of a risk (STRIDE / ENISA / CWE / OTM references)
      properties:
        strideCategories:
          type: array
          description: STRIDE threat categories
          items:
            type: string
          example: [Tampering, Elevation of Privilege]
        enisaCategory:
          type: string
          maxLength: 200
          description: ENISA threat taxonomy category
          example: Nefarious activity / Abuse
        enisaThreat:
          type: string
          maxLength: 300
          description: ENISA threat name
          example: Web-application / injection attacks (SQLi, XSS)
        cwes:
          type: array
          description: Related CWE identifiers
          items:
            type: string
          example: [CWE-89, CWE-79]
        affectedElementType:
          type: string
          maxLength: 100
          description: Type of the affected threat-model element
          example: process
        trustBoundaryCrossing:
          type: boolean
          description: Whether the threat crosses a trust boundary
        tmRunId:
          type: string
          maxLength: 200
          description: Identifier of the threat-modelling run that produced this risk
          example: tm-run-2026-06-04-001
        tmMethod:
          type: string
          maxLength: 200
          description: Threat-modelling method used
          example: STRIDE-per-Element
        otmThreatId:
          type: string
          maxLength: 200
          description: Open Threat Model threat identifier
          example: t-sqli-login

    ThreatModelSummary:
      title: Threat model summary
      type: object
      description: Diff/roll-up counters the TM agent attaches to a run
      properties:
        totalThreats: {type: integer, minimum: 0, example: 23}
        newThreats: {type: integer, minimum: 0, example: 3}
        updatedThreats: {type: integer, minimum: 0, example: 1}
        unchangedThreats: {type: integer, minimum: 0, example: 19}
        removedThreats: {type: integer, minimum: 0, example: 0}
        totalCountermeasures: {type: integer, minimum: 0, example: 41}
        newCountermeasures: {type: integer, minimum: 0, example: 5}
        implementedCountermeasures: {type: integer, minimum: 0, example: 28}

    ThreatModelDocument:
      title: Threat model document
      type: object
      description: >-
        A stored per-project threat-model document snapshot (OTM or Threat
        Dragon). `content` and `format` are always present and are the
        authoritative parse contract (the consumer parses `content` per
        `format`). `formatVersion` and `summary` are optional and may be absent,
        so consumers must not depend on them. `companyId` is never returned.
      required:
        - content
        - format
      properties:
        _id:
          type: string
        projectId:
          type: string
        threatModelId:
          type: string
          description: Optional link to the editable per-project threat model
        created:
          type: string
          format: date-time
        userId:
          type: string
        userName:
          type: string
        tmRunId:
          type: string
          maxLength: 200
          example: tm-run-2026-06-04-001
        previousTmRunId:
          type: string
          maxLength: 200
          example: tm-run-2026-06-03-001
        format:
          type: string
          enum: [otm, threat-dragon]
          default: otm
        formatVersion:
          type: string
          maxLength: 50
          example: 0.2.0
        content:
          type: string
          description: Complete document payload (OTM YAML / Threat Dragon JSON), up to 5 MB
        status:
          type: string
          enum: [draft, reviewed, approved]
          default: draft
        summary:
          $ref: '#/components/schemas/ThreatModelSummary'

    Risk:
