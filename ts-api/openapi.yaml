        - name: scanId
          in: query
          description: Scan id
          schema:
            type: string
        - name: moduleId
          in: query
          description: Module id
          schema:
            type: string
        - name: projectName
          in: query
          description: Project name (alternative to moduleId/analysisId/scanId; pair with moduleName). Project must already exist.
          schema:
            type: string
        - name: moduleName
          in: query
          description: |
